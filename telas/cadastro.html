<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Vaso Automatizado Maker</title>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ficheiro de Estilo do Cadastro -->
    <link rel="stylesheet" href="../estilos/cadastro.css">
</head>
<body>

    <main class="register-container">
        <div class="register-card">
            <!-- Logo na tela -->
            <div class="logo">
                <i class="fa-solid fa-leaf"></i> EcoVaso <span>Maker</span>
            </div>

            <h2>Crie a sua conta</h2>
            <p class="subtitle">Cadastre-se para começar a gerir o seu vaso inteligente</p>

            <!-- Formulário de Cadastro -->
            <form id="registerForm" class="register-form">
                <div class="input-group">
                    <label for="username">Nome de Usuário</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Crie um nome de usuário" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Crie uma senha forte" required minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmação de Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved"></i>
                        <input type="password" id="confirmPassword" placeholder="Repita a sua senha" required minlength="6">
                    </div>
                </div>

                <!-- Mensagem de erro caso as senhas não coincidam -->
                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn-register">
                    <i class="fa-solid fa-user-check"></i> Cadastrar
                </button>
            </form>

            <!-- Chamada para quem já tem conta -->
            <div class="login-callout">
                <p>Já possui uma conta?</p>
                <a href="login.html" class="btn-login-link">
                    <i class="fa-solid fa-right-to-bracket"></i> Fazer Login
                </a>
            </div>

            <div class="register-footer">
                <p><a href="inicio.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a></p>
            </div>
        </div>
    </main>

    <!-- Script de validação do cadastro -->
    <script src="../scripts/cadastro.js"></script>
</body>
</html>
